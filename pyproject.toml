[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-quality-gate"
version = "0.1.0"
description = "A compact computer-vision inspection baseline that classifies synthetic surface defects and explains when it should abstain."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "pillow>=10.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
